# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

# Windows: reduces file-handle contention with NeoForm tasks touching Minecraft jars (client-extra, etc.).
org.gradle.vfs.watch=false

# Mod properties
mod_version=5.11.19

# Fabric Properties
# check these on https://fabricmc.net/develop/
minecraft_version=1.21.1
yarn_version=1.21.1+build.1
loader_version=0.15.11
fapi_version=0.102.0+1.21.1

# Dependencies
rei_version=16.0.754
# JEI NeoForge API (MC 1.21.1) — see maven.blamejared.com/mezz/jei/jei-1.21.1-neoforge-api/
jei_version=19.27.0.340

pal_version=1.10.0

# NeoGradle uses neo_version for net.neoforged:neoforge.
neo_version=21.1.219
minecraft_version_range=[1.21.1,1.21.2)
loader_version_range=[4,)
mod_license=MIT

# Parchment (NeoGradle MDK defaults)
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# NeoForge-only port targets (Minecraft from minecraft_version above)
# NeoForge artifact version for mods.toml dependency range and future NeoGradle deps.
neoforge_version=21.1.219
# Arclight hybrid-server snapshot used for runtime validation (not declared in mods.toml).
arclight_version=1.0.2-SNAPSHOT-668f9f3