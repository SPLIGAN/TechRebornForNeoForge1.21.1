name: Check
on:
  pull_request:
  push:
    branches:
    - '**'
    - '!l10n/*'

jobs:
  build:
    strategy:
      matrix:
        java: [ 25-jdk ]
    runs-on: ubuntu-24.04
    container:
      image: eclipse-temurin:${{ matrix.java }}
      options: --user root
    steps:
      - run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: chmod +x gradlew
      - run: ./gradlew :RebornCore:runServerData --stacktrace
      - name: Check committed datagen output is up to date
        run: git status --porcelain -- src/main/generated && test -z "$(git status --porcelain -- src/main/generated)"
      - run: ./gradlew build --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/